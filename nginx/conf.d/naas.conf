server {
    listen 80;
    server_name naas.paulyprograms.com;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

}



server {
    listen 443 ssl;
    server_name naas.paulyprograms.com;

    # Paths to the SSL certificates generated by Certbot
    ssl_certificate /etc/letsencrypt/live/naas.paulyprograms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naas.paulyprograms.com/privkey.pem;



    # Route requests to Angular Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    # Spring Boot API
    location /api/ {
        proxy_pass http://api-service:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}